name: data

# closes:  after every US session ends (after-hours stop at 20:00 New York time),
#          the regular close and the last after-hours trade for each stock.
# night:   Monday before the open (the Worker starts it at 8:40 and 9:10 New York time): what Base priced over the weekend.
# open:    Monday, after the open: how each stock really opened.
# game:    with Friday's closes run, opens next Monday's "Beat the night" round (scripts/game.mjs).
# The Cloudflare Worker (base-tools check-worker/clock.js) starts each job on time
# with workflow_dispatch; GitHub's own schedule ran hours late or not at all.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "closes, night or open"
        required: true
        default: closes

permissions:
  contents: write

concurrency: data

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pick the job
        id: pick
        run: |
          if [ -n "${{ github.event.inputs.job }}" ]; then echo "job=${{ github.event.inputs.job }}" >> "$GITHUB_OUTPUT"; exit 0; fi
          case "${{ github.event.schedule }}" in
            "25 13 * * 1") echo "job=night" >> "$GITHUB_OUTPUT" ;;
            "5 15 * * 1") echo "job=open" >> "$GITHUB_OUTPUT" ;;
            *) echo "job=closes" >> "$GITHUB_OUTPUT" ;;
          esac
      - run: |
          case "${{ steps.pick.outputs.job }}" in
            closes) node scripts/closes.mjs && (node scripts/game.mjs || echo "game: round not opened") ;;
            night) node scripts/monday.mjs night ;;
            open) node scripts/monday.mjs open ;;
          esac
      - name: Save
        run: |
          git config user.name "night-shift data"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: ${{ steps.pick.outputs.job }} $(date -u +%F)"
          git push
